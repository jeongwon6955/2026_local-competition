<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전국 도서관 현황</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.hd{background:#2c3e50;color:#fff;padding:18px 30px;text-align:center;font-size:22px;font-weight:bold;letter-spacing:2px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.mc{max-width:1400px;margin:20px auto;padding:0 20px}
.sec{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:24px}
.sec h2{font-size:18px;margin-bottom:12px;color:#2c3e50;border-left:4px solid #3498db;padding-left:10px}
.sec h2.red{border-left-color:#e74c3c;margin-bottom:16px}
.lg{display:flex;gap:20px;margin-bottom:16px;padding:10px 16px;background:#f8f9fa;border-radius:8px;font-size:13px;align-items:center}
.li{display:flex;align-items:center;gap:6px}
.lc{width:14px;height:14px;border-radius:3px}
.mw{position:relative;width:100%;max-width:700px;margin:0 auto}
.mw svg{width:100%;height:auto}
.mw svg .land{fill:#dce3e8;stroke:#fff;stroke-width:.5;cursor:pointer;transition:fill .2s}
.mw svg .land:hover,.mw svg .land.active{fill:#a8c8e8}
.bar-group{pointer-events:all;cursor:pointer}
.bar-group:hover .bbg{fill:rgba(255,255,255,.85)}
.tp{position:absolute;background:rgba(44,62,80,.95);color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tp.show{opacity:1}
.tp .t{font-weight:bold;font-size:13px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:4px}
.tp .r{display:flex;justify-content:space-between;gap:16px;margin-top:3px}
.tp .l{opacity:.8}
.tp .v{font-weight:bold}
.tc{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.sb{display:flex;align-items:center;gap:8px}
.sb label{font-size:13px;font-weight:bold;color:#555}
.sb input{padding:8px 14px;border:2px solid #ddd;border-radius:8px;font-size:13px;width:260px;outline:none;transition:border-color .2s}
.sb input:focus{border-color:#3498db}
.sc{display:flex;align-items:center;gap:8px;font-size:13px}
.sc label{font-weight:bold;color:#555}
.btn{padding:6px 14px;border:2px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;transition:all .2s}
.btn:hover{border-color:#3498db;color:#3498db}
.btn.on{background:#3498db;border-color:#3498db;color:#fff}
.tw{overflow-x:auto;border-radius:8px;border:1px solid #e0e0e0;max-height:500px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:1200px}
thead{position:sticky;top:0;z-index:10}
th{background:#2c3e50;color:#fff;padding:10px 8px;text-align:center;font-weight:bold;white-space:nowrap;font-size:12px}
tbody tr{transition:background .15s}
tbody tr:nth-child(even){background:#f8f9fa}
tbody tr:hover{background:#eaf2f8}
td{padding:8px;border-bottom:1px solid #eee;text-align:center;white-space:nowrap}
td.tl{text-align:left}
mark{background:#f1c40f;color:#333;padding:0 2px;border-radius:2px}
.nd{text-align:center;padding:40px;color:#999;font-size:14px}
.dc{font-size:12px;color:#888;margin-top:8px}
.ld{text-align:center;padding:60px;color:#999;font-size:16px}
.ld::after{content:'';display:inline-block;width:20px;height:20px;border:3px solid #ddd;border-top-color:#3498db;border-radius:50%;animation:sp .8s linear infinite;margin-left:10px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="hd">📚 전국 도서관 현황</div>
<div class="mc">
  <div class="sec">
    <h2>지역별 도서관 현황 지도</h2>
    <div class="lg">
      <div class="li"><div class="lc" style="background:#e74c3c"></div><span>도서관 수</span></div>
      <div class="li"><div class="lc" style="background:#2ecc71"></div><span>자료수(도서)</span></div>
      <div class="li"><div class="lc" style="background:#3498db"></div><span>열람좌석수</span></div>
    </div>
    <div class="mw" id="mw"><div class="ld" id="ml">지도 데이터를 불러오는 중</div><div class="tp" id="tp"></div></div>
  </div>
  <div class="sec">
    <h2 class="red">전체 도서관 목록</h2>
    <div class="tc">
      <div class="sb"><label>🔍 도서관명 검색:</label><input type="text" id="si" placeholder="도서관명을 입력하세요..."></div>
      <div class="sc"><label>자료수(도서) 정렬:</label>
        <button class="btn on" data-s="default">기본(시도명↑)</button>
        <button class="btn" data-s="desc">내림차순 ▼</button>
        <button class="btn" data-s="asc">오름차순 ▲</button>
      </div>
    </div>
    <div class="tw"><table>
      <thead><tr><th>No.</th><th>시도명</th><th>도서관명</th><th>시군구명</th><th>도서관유형</th><th>휴관일</th><th>평일 시작</th><th>평일 종료</th><th>열람좌석수</th><th>자료수(도서)</th><th>대출가능권수</th><th>대출가능일수</th><th>소재지도로주소명</th></tr></thead>
      <tbody id="tb"><tr><td colspan="13" class="nd"><div class="ld">데이터를 불러오는 중</div></td></tr></tbody>
    </table></div>
    <div class="dc" id="dc"></div>
  </div>
</div>
<script>
(function(){ // 외부 변수와 충돌을 막기 위한 즉시 실행 함수(IIFE) 시작
// 1. 전역 설정 변수들
var NS='http://www.w3.org/2000/svg', // SVG 요소를 생성할 때 필요한 네임스페이스 주소
// 지역명을 지도 코드(ISO)로 매핑하는 객체
S2I={'서울특별시':'KR-11','서울':'KR-11','부산광역시':'KR-26','부산':'KR-26','대구광역시':'KR-27','대구':'KR-27','인천광역시':'KR-28','인천':'KR-28','광주광역시':'KR-29','광주':'KR-29','대전광역시':'KR-30','대전':'KR-30','울산광역시':'KR-31','울산':'KR-31','경기도':'KR-41','경기':'KR-41','강원특별자치도':'KR-42','강원도':'KR-42','강원':'KR-42','충청북도':'KR-43','충북':'KR-43','충청남도':'KR-44','충남':'KR-44','전북특별자치도':'KR-45','전라북도':'KR-45','전북':'KR-45','전라남도':'KR-46','전남':'KR-46','경상북도':'KR-47','경북':'KR-47','경상남도':'KR-48','경남':'KR-48','제주특별자치도':'KR-49','제주':'KR-49','제주도':'KR-49','세종특별자치시':'KR-50','세종':'KR-50'},
// 지도 코드를 짧은 지역명으로 매핑하는 객체 (지도 라벨용)
I2S={'KR-11':'서울','KR-26':'부산','KR-27':'대구','KR-28':'인천','KR-29':'광주','KR-30':'대전','KR-31':'울산','KR-41':'경기','KR-42':'강원','KR-43':'충북','KR-44':'충남','KR-45':'전북','KR-46':'전남','KR-47':'경북','KR-48':'경남','KR-49':'제주','KR-50':'세종'},
// 각 지역별 막대그래프가 그려질 지도 상의 x, y 좌표
RP={'KR-11':[148,280],'KR-26':[330,575],'KR-27':[300,475],'KR-28':[115,295],'KR-29':[108,555],'KR-30':[180,410],'KR-31':[355,505],'KR-41':[165,315],'KR-42':[280,255],'KR-43':[225,375],'KR-44':[120,435],'KR-45':[155,500],'KR-46':[140,600],'KR-47':[300,385],'KR-48':[260,545],'KR-49':[90,775],'KR-50':[178,400]},
D=[], // 서버에서 받아온 전체 도서관 데이터를 저장할 배열
srt='default', // 현재 정렬 상태 (기본값: 시도명순)
sT='', // 현재 검색어 저장 변수
$=function(id){return document.getElementById(id)}; // document.getElementById를 짧게 쓰기 위한 헬퍼 함수

// 2. 유틸리티 함수
function N(v){var n=Number(v);return(v==null||isNaN(n))?0:n} // 문자열 숫자를 실제 숫자로 변환 (값이 없으면 0 반환)
function F(n){ // 숫자를 '억', '만' 단위 한글 포맷으로 변경하는 함수
  n=N(n);
  if(n>=1e8){ // 1억 이상일 때
    var e=~~(n/1e8),m=~~(n%1e8/1e4);
    return m?e+'억'+m+'만':e+'억'
  }
  if(n>=1e4){ // 1만 이상일 때
    var m2=~~(n/1e4),r=n%1e4;
    return r?m2+'만'+r.toLocaleString():m2+'만'
  }
  return n.toLocaleString() // 그 미만은 콤마(,) 표시만
}

// 3. 통계 계산 함수
function stats(){
  var o={}; // 결과를 담을 객체
  for(var i=0;i<D.length;i++){
    var d=D[i],s=(d['시도명']||'').trim(),id=S2I[s];
    if(!id)continue; // 시도명이 매핑되지 않으면 건너뜀
    if(!o[id])o[id]={c:0,b:0,s:0,n:s}; // 해당 지역 데이터가 처음이면 초기화
    o[id].c++; // 도서관 수 증가
    o[id].b+=N(d['자료수(도서)']); // 도서 총합 누적
    o[id].s+=N(d['열람좌석수']); // 좌석 총합 누적
  }
  return o;
}

// 4. 툴팁(말풍선) 표시 관련 함수
function showTT(e,n,s){ // 툴팁 보이기
  var t=$('tp');
  t.innerHTML='<div class="t">'+n+'</div>'+
              '<div class="r"><span class="l">도서관 수</span><span class="v" style="color:#e74c3c">'+F(s.c)+'개</span></div>'+
              '<div class="r"><span class="l">자료수(도서)</span><span class="v" style="color:#2ecc71">'+F(s.b)+'권</span></div>'+
              '<div class="r"><span class="l">열람좌석수</span><span class="v" style="color:#5dade2">'+F(s.s)+'석</span></div>';
  t.classList.add('show'); // 툴팁 표시 CSS 클래스 추가
  mvTT(e); // 툴팁 위치 조정
}
function mvTT(e){ // 마우스 움직임에 따라 툴팁 위치 이동
  var t=$('tp'),w=$('mw'),r=w.getBoundingClientRect(),
      x=e.clientX-r.left+16,y=e.clientY-r.top-10;
  if(x+200>w.offsetWidth)x=e.clientX-r.left-200; // 화면 오른쪽을 벗어나면 왼쪽으로 표시
  if(y<0)y=10;
  t.style.left=x+'px';
  t.style.top=y+'px';
}

// 5. 지도 위 막대그래프 그리기 함수
function drawBars(svg){
  var st=stats(),ids=Object.keys(st);
  if(!ids.length)return;
  var mc=1,mb=1,ms=1; // 각 항목별 최댓값 찾기 (비율 계산용)
  for(var i=0;i<ids.length;i++){
    var s=st[ids[i]];
    if(s.c>mc)mc=s.c; if(s.b>mb)mb=s.b; if(s.s>ms)ms=s.s
  }
  var MH=55,BW=8,G=2,TW=BW*3+G*2,g=svg.querySelector('g');
  if(!g)return;
  // SVG 패턴 정의 (막대 안의 빗금 무늬)
  var df=svg.querySelector('defs')||svg.insertBefore(document.createElementNS(NS,'defs'),svg.firstChild);
  [['p-r','#e74c3c'],['p-g','#2ecc71'],['p-b','#3498db']].forEach(function(c){
    var p=document.createElementNS(NS,'pattern');
    p.setAttribute('id',c[0]);p.setAttribute('patternUnits','userSpaceOnUse');
    p.setAttribute('width','4');p.setAttribute('height','4');p.setAttribute('patternTransform','rotate(45)');
    var r=document.createElementNS(NS,'rect');
    r.setAttribute('width','4');r.setAttribute('height','4');r.setAttribute('fill',c[1]);
    p.appendChild(r);
    var l=document.createElementNS(NS,'line');
    l.setAttribute('x1','0');l.setAttribute('y1','0');l.setAttribute('x2','0');l.setAttribute('y2','4');
    l.setAttribute('stroke','rgba(255,255,255,.4)');l.setAttribute('stroke-width','1.5');
    p.appendChild(l);df.appendChild(p);
  });
  var fl=['url(#p-r)','url(#p-g)','url(#p-b)'];
  // 각 지역별로 막대 그룹 생성
  ids.forEach(function(id){
    var pos=RP[id]; if(!pos)return;
    var s=st[id],hs=[Math.max(3,Math.round(s.c/mc*MH)),Math.max(3,Math.round(s.b/mb*MH)),Math.max(3,Math.round(s.s/ms*MH))];
    var gr=document.createElementNS(NS,'g');
    gr.setAttribute('class','bar-group');gr.setAttribute('transform','translate('+pos[0]+','+pos[1]+')');
    var bg=document.createElementNS(NS,'rect'); // 막대 뒤 반투명 배경
    bg.setAttribute('class','bbg');bg.setAttribute('x','-4');bg.setAttribute('y',String(-MH-14));
    bg.setAttribute('width',String(TW+8));bg.setAttribute('height',String(MH+28));
    bg.setAttribute('fill','rgba(255,255,255,.55)');bg.setAttribute('rx','3');
    gr.appendChild(bg);
    for(var b=0;b<3;b++){ // 3가지 지표(수, 도서, 좌석) 막대 생성
      var rc=document.createElementNS(NS,'rect');
      rc.setAttribute('x',String(b*(BW+G)));rc.setAttribute('y',String(-hs[b]));
      rc.setAttribute('width',String(BW));rc.setAttribute('height',String(hs[b]));
      rc.setAttribute('fill',fl[b]);rc.setAttribute('rx','1');
      gr.appendChild(rc)
    }
    var tx=document.createElementNS(NS,'text'); // 지역명 텍스트
    tx.setAttribute('x',String(~~(TW/2)));tx.setAttribute('y','12');
    tx.setAttribute('text-anchor','middle');tx.setAttribute('font-size','9');
    tx.setAttribute('font-weight','bold');tx.setAttribute('fill','#2c3e50');
    tx.textContent=I2S[id]||id;gr.appendChild(tx);
    // 막대 그룹에 이벤트 연결
    (function(g,n,st){
      g.onmouseenter=function(e){showTT(e,n,st)}; // 마우스 진입 시 툴팁 표시
      g.onmousemove=mvTT; // 마우스 이동 시 툴팁 따라다님
      g.onmouseleave=function(){$('tp').classList.remove('show')}; // 마우스 이탈 시 툴팁 숨김
    })(gr,s.n,s);
    g.appendChild(gr);
  });
}

// 6. 하단 데이터 테이블 렌더링 함수
function render(){
  var d=D.slice(); // 원본 데이터 복사
  if(sT)d=d.filter(function(v){return v['도서관명']&&v['도서관명'].indexOf(sT)!==-1}); // 검색 필터링
  if(srt==='default')d.sort(function(a,b){return(a['시도명']||'').localeCompare(b['시도명']||'','ko')}); // 가나다순 정렬
  else d.sort(function(a,b){var r=N(a['자료수(도서)'])-N(b['자료수(도서)']);return srt==='desc'?-r:r}); // 숫자순 정렬
  var tb=$('tb');
  if(!d.length){tb.innerHTML='<tr><td colspan="13" class="nd">검색 결과가 없습니다.</td></tr>';$('dc').textContent='';return}
  // 검색어 강조(하이라이트) 준비
  var h='',esc=sT?sT.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'):'',re=esc?new RegExp('('+esc+')','gi'):null;
  for(var i=0;i<d.length;i++){
    var v=d[i],nm=v['도서관명']||'';
    if(re)nm=nm.replace(re,'<mark>$1</mark>'); // 검색어 일치 부분에 <mark> 태그 삽입
    // 행(tr) HTML 생성
    h+='<tr><td>'+(i+1)+'</td><td>'+(v['시도명']||'')+'</td><td class="tl">'+nm+'</td><td>'+(v['시군구명']||'')+'</td><td>'+(v['도서관유형']||'')+'</td><td>'+(v['휴관일']||'')+'</td><td>'+(v['평일운영시작시각']||'')+'</td><td>'+(v['평일운영종료시각']||'')+'</td><td>'+N(v['열람좌석수']).toLocaleString()+'</td><td>'+N(v['자료수(도서)']).toLocaleString()+'</td><td>'+(v['대출가능권수']!=null?v['대출가능권수']:'')+'</td><td>'+(v['대출가능일수']!=null?v['대출가능일수']:'')+'</td><td class="tl">'+(v['소재지도로명주소']||'')+'</td></tr>';
  }
  tb.innerHTML=h; // 테이블에 반영
  $('dc').textContent='총 '+d.length.toLocaleString()+'개 도서관'+(sT?' (검색: "'+sT+'")':'')+' / 전체 '+D.length.toLocaleString()+'개';
}

// 7. 이벤트 리스너 설정
$('si').oninput=function(e){sT=e.target.value.trim();render()}; // 검색창 입력 이벤트
document.querySelectorAll('.btn[data-s]').forEach(function(b){ // 정렬 버튼 클릭 이벤트
  b.onclick=function(){
    document.querySelectorAll('.btn[data-s]').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');srt=b.dataset.s;render()
  }
});

// 8. 데이터 초기 로드 (JSON 및 SVG)
fetch('RES/C/도서관현황.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  if(!Array.isArray(d))throw 0;
  D=d; // 데이터 저장
  fetch('RES/C/southKoreaHigh.svg').then(function(r){return r.text()}).then(function(t){
    $('ml').style.display='none'; // 로딩 메시지 숨김
    var p=new DOMParser(),sv=p.parseFromString(t,'image/svg+xml').querySelector('svg');
    sv.setAttribute('viewBox','0 0 420 820');sv.setAttribute('width','100%');sv.setAttribute('height','100%');
    var ds=sv.querySelector('defs style');if(ds)ds.textContent=''; // SVG 내부 스타일 초기화
    $('mw').insertBefore(sv,$('tp')); // 지도를 화면에 삽입
    // 각 지역별 하이라이트 효과
    sv.querySelectorAll('.land').forEach(function(p){
      p.onmouseenter=function(){p.classList.add('active')};
      p.onmouseleave=function(){p.classList.remove('active')}
    });
    drawBars(sv); // 지도 위에 막대 그리기
  });
  render(); // 하단 표 그리기
}).catch(function(){ // 에러 처리
  $('ml').textContent='❌ 도서관현황.json을 불러올 수 없습니다.';
  $('tb').innerHTML='<tr><td colspan="13" class="nd">❌ 로드 실패</td></tr>';
});
